[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctl-stop-harness"
version = "0.2.1"
license = {text = "Apache-2.0"}
description = "Vendor-neutral conformance harness for agentic AI stop mechanisms (proof of concept)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
frameworks = ["langgraph>=1.2", "langchain-core>=1.6", "inspect-ai>=0.3.281"]

[tool.setuptools.packages.find]
include = ["stopharness*"]

[tool.setuptools.package-data]
stopharness = ["controls/*.yaml", "mappings/*.yaml"]
